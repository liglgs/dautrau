services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.mvp
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: development
      INVESTIGATOR_TOKEN: ${INVESTIGATOR_TOKEN:?Set INVESTIGATOR_TOKEN locally}
      REVIEWER_TOKEN: ${REVIEWER_TOKEN:?Set REVIEWER_TOKEN locally}
      MVP_DB_PATH: ${MVP_DB_PATH:-/app/data/mvp.sqlite3}
      MVP_SNAPSHOT_ROOT: /app/data/snapshots
      MVP_SOURCE_MODE: ${MVP_SOURCE_MODE:-fixture}
      MVP_EVIDENCE_MODE: ${MVP_EVIDENCE_MODE:-fixture}
      MVP_PERSON3_DEMO_SCENARIO: ${MVP_PERSON3_DEMO_SCENARIO:-match}
      MVP_DICTIONARY_PATH: ${MVP_DOCKER_DICTIONARY_PATH:-/app/resources/dictionaries/mvp_candidates_2026_10_02.json}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-auto}
      MODEL_NAME: ${MODEL_NAME:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_DOCKER_BASE_URL:-}
      MVP_PUBMED_MODE: ${MVP_PUBMED_MODE:-api}
      MVP_PUBMED_CORPUS_ROOT: /app/data/pubmed-local
      MVP_SOURCE_MAX_DOCUMENTS: ${MVP_SOURCE_MAX_DOCUMENTS:-5}
      CORS_ORIGINS: http://127.0.0.1:3100,http://localhost:3100
    volumes:
      - mvp_data:/app/data
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      VIGILENS_API_BASE: http://backend:8000
      VIGILENS_INVESTIGATOR_TOKEN: ${INVESTIGATOR_TOKEN:?Set INVESTIGATOR_TOKEN locally}
      VIGILENS_REVIEWER_TOKEN: ${REVIEWER_TOKEN:?Set REVIEWER_TOKEN locally}
    depends_on:
      backend:
        condition: service_healthy
volumes:
  mvp_data:
