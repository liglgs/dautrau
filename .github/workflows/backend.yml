name: Backend
on:
  push:
    branches: [main, develop, feat/project-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    # GitHub-managed service containers require a Linux runner with Docker.
    runs-on: [self-hosted, Linux]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medreview
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: medreview_test
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U medreview -d medreview_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEMO_PASSWORD: ci-demo-password
      APP_ENV: test
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - name: Configure isolated PostgreSQL service port
        run: echo "DATABASE_URL=postgresql+psycopg://medreview:test-password@localhost:${{ job.services.postgres.ports['5432'] }}/medreview_test" >> "$GITHUB_ENV"
      - run: python -m alembic upgrade head
      - run: python -m scripts.seed_vmec
      - run: python -m pytest tests -q --basetemp "${{ runner.temp }}/pytest-${{ github.job }}"
      - run: python -m ruff check src/api/vmec_routes.py src/api/research_routes.py src/api/security.py src/db.py src/vmec.py src/worker.py src/ai/model.py tests/test_vmec_api.py
