name: CI

on:
  push:
    branches: [main, develop, feat/project-foundation]
  pull_request:
    branches: [main, 'codex/pr-mvp-*']
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

concurrency:
  group: mvp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Lint with ruff
        run: python -m ruff check src/ tests/ scripts/mvp_backup.py scripts/mvp_deployment_smoke.py scripts/smoke_sources.py scripts/import_pubmed.py

      - name: Check OpenAPI contract
        run: python -m scripts.export_openapi --check

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short --basetemp "${{ runner.temp }}/pytest-${{ github.job }}"
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key

  frontend:
    runs-on: self-hosted
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_VIGILENS_DATA_MODE: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker-mvp:
    runs-on: self-hosted
    timeout-minutes: 25
    concurrency:
      group: p066-mvp-stack-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    env:
      COMPOSE_PROJECT_NAME: p066-ci-${{ github.run_id }}-${{ github.run_attempt }}
      INVESTIGATOR_TOKEN: ci-fixture-investigator
      REVIEWER_TOKEN: ci-fixture-reviewer
      MVP_SOURCE_MODE: fixture
      MVP_EVIDENCE_MODE: fixture
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - name: Validate Compose
        run: docker compose -f docker-compose.mvp.yml config --quiet
      - name: Build and start fixture stack
        run: docker compose -f docker-compose.mvp.yml up -d --build --wait --wait-timeout 120
      - name: Check proxy, review gates, citations and Markdown export
        run: python -m scripts.mvp_deployment_smoke --output data/deployment-smoke.json
      - name: Back up stopped database and restore to new directory
        run: |
          docker compose -f docker-compose.mvp.yml stop backend
          docker compose -f docker-compose.mvp.yml run --rm --no-deps backend python -m scripts.mvp_backup backup --stopped --output /app/data/backup
          docker compose -f docker-compose.mvp.yml run --rm --no-deps backend python -m scripts.mvp_backup restore --source /app/data/backup --output /app/data/restored
      - name: Start restored database
        env:
          MVP_DB_PATH: /app/data/restored/mvp.sqlite3
        run: docker compose -f docker-compose.mvp.yml up -d --wait --wait-timeout 120 backend
      - name: Verify original approved export after restore
        run: python -m scripts.mvp_deployment_smoke --verify-result data/deployment-smoke.json
      - name: Container status and logs
        if: always()
        run: |
          docker compose -f docker-compose.mvp.yml ps -a
          docker compose -f docker-compose.mvp.yml logs --no-color --tail 100
      - name: Upload smoke summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp-deployment-smoke
          path: data/deployment-smoke.json
          if-no-files-found: ignore
      - name: Remove ephemeral CI stack
        if: always()
        run: docker compose -f docker-compose.mvp.yml down -v --rmi local
