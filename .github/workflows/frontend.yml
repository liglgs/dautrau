name: Frontend
on:
  push:
    branches: [main, develop, feat/project-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: self-hosted
    concurrency:
      group: p066-browser-e2e-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
